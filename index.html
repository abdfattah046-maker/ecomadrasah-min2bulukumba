<!-- MULAI KODE DASBOR GURU (TAMPILAN & LOGIKA KELAS)                     -->
<!-- SILAKAN PASTE KODE INI UNTUK MENGGANTIKAN DASBOR GURU YANG LAMA      -->
<!-- ==================================================================== -->

<div id="section-dasbor-guru" class="mt-6">
    <!-- Header Teks Binaan -->
    <div class="mb-4">
       <p class="text-emerald-700 text-lg font-semibold">
    Halo, <span id="nama-guru-login">Guru</span> (TEACHER) – 
    <span id="teks-binaan" class="text-emerald-600 font-bold">Binaan Kelas ...</span>
</p>
    </div>

    <!-- Tabel Siswa Binaan -->
    <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden mt-4">
        <h3 class="text-md font-bold p-4 bg-slate-50 text-slate-800 border-b flex items-center">
            <svg class="w-5 h-5 mr-2 text-emerald-600" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"></path>
            </svg>
            Daftar Siswa Binaan Anda
        </h3>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-100 text-slate-600 text-sm">
                        <th class="p-4 font-semibold border-b">ID Siswa</th>
                        <th class="p-4 font-semibold border-b">Nama Siswa</th>
                        <th class="p-4 font-semibold border-b text-center">Kelas</th>
                    </tr>
                </thead>
                <tbody id="tabel-siswa">
                    <!-- Data siswa akan diisi otomatis dari Spreadsheet -->
                    <tr>
                        <td colspan="3" class="text-center py-6 text-slate-500">Memuat data siswa...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Script Logika Filter Guru & Siswa -->
<script>
// Panggil fungsi ini SETELAH proses login berhasil dan data siswa dari API sudah diambil
// Contoh pemanggilan: renderTabelBinaanGuru(dataLoginGuru, dataSemuaSiswa);

function renderTabelBinaanGuru(currentUser, dataSiswaGlobal) {
    // 1. Masukkan Nama Guru ke layar
    let elemenNama = document.getElementById('nama-guru-login');
    if(elemenNama) {
        elemenNama.innerText = currentUser.nama_guru || currentUser.Nama || currentUser.nama || "Guru";
    }

    // 2. Baca Kolom "Tugas" (Misal: "Guru Kelas 5", "Guru Mapel")
    let tugasGuru = currentUser.Tugas || currentUser.tugas || ""; 
    let tugasLower = tugasGuru.toLowerCase();

    let namaKelasBinaan = "";
    let daftarSiswaBinaan = [];

    // 3. Logika Menentukan Kelas Binaan
    if (tugasLower.includes("mapel") || tugasLower.includes("pjok") || tugasLower.includes("kepala")) {
        // Guru Mapel / PJOK / Kepala Madrasah melihat SEMUA siswa
        namaKelasBinaan = "Semua Kelas";
        daftarSiswaBinaan = dataSiswaGlobal; 
        
    } else if (tugasLower.includes("kelas")) {
        // Ekstrak angka dari teks "Guru Kelas 5" -> "5"
        let angkaKelas = tugasGuru.replace(/[^0-9]/g, ''); 
        
        if(angkaKelas !== "") {
            namaKelasBinaan = "Kelas " + angkaKelas;
            // FILTER: Hanya ambil siswa yang angka kelasnya SAMA dengan angkaKelas guru
            daftarSiswaBinaan = dataSiswaGlobal.filter(siswa => {
                // Antisipasi perbedaan nama kolom di API (Kelas, kelas, atau Kelas_Siswa)
                let kelasSiswa = siswa.Kelas || siswa.kelas || siswa.Kelas_Siswa || "";
                return String(kelasSiswa) === String(angkaKelas);
            });
        } else {
            namaKelasBinaan = "Tidak Ada Binaan";
        }
    } else {
        namaKelasBinaan = "Tidak Ada Binaan";
    }

    // 4. Tampilkan Teks Binaan di Layar (Misal: "Binaan Kelas 5")
    let elemenTeksBinaan = document.getElementById('teks-binaan');
    if(elemenTeksBinaan) {
        elemenTeksBinaan.innerText = "Binaan " + namaKelasBinaan;
    }

    // 5. Cetak Data Siswa ke Tabel
    let tbodySiswa = document.getElementById('tabel-siswa');
    if(tbodySiswa) {
        tbodySiswa.innerHTML = ''; // Bersihkan tulisan "Memuat data..."
        
        if (daftarSiswaBinaan.length === 0) {
            tbodySiswa.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-slate-500 italic">Tidak ada data siswa yang cocok dengan kelas ini.</td></tr>';
        } else {
            // Urutkan siswa berdasarkan nama agar rapi (Opsional)
            daftarSiswaBinaan.sort((a, b) => {
                let namaA = (a.Nama_Siswa || a.Nama || a.nama || "").toLowerCase();
                let namaB = (b.Nama_Siswa || b.Nama || b.nama || "").toLowerCase();
                return namaA.localeCompare(namaB);
            });

            // Looping dan buat baris tabel
            daftarSiswaBinaan.forEach(siswa => {
                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                
                let idSiswa = siswa.ID_Siswa || siswa.ID || siswa.id_siswa || '-';
                let namaSiswa = siswa.Nama_Siswa || siswa.Nama || siswa.nama_siswa || '-';
                let kelasSiswa = siswa.Kelas || siswa.kelas || '-';

                tr.innerHTML = `
                    <td class="border-b border-slate-200 p-4 text-slate-700">${idSiswa}</td>
                    <td class="border-b border-slate-200 p-4 text-slate-700 font-medium">${namaSiswa}</td>
                    <td class="border-b border-slate-200 p-4 text-slate-700 text-center">
                        <span class="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-sm font-semibold">${kelasSiswa}</span>
                    </td>
                `;
                tbodySiswa.appendChild(tr);
            });
        }
    }
}
</script>
